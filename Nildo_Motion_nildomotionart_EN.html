<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nildo Motion | @nildomotionart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Outfit:wght@500;600;700&display=swap">
<style>
:root{
  --c1:#8C0000; --c2:#F00000; --c3:#F8650C; --c4:#FFC917; --c5:#FFE100;
  --bg:#FFF0BD; --ink:#4A0A00; --card:#FFF8DC; --btn:#FFFDF2; color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-weight:600;display:flex;justify-content:center}
.wrap{width:100%;max-width:460px;padding:36px 20px 32px}
.bar{height:14px;border:3px solid var(--c4);box-shadow:4px 4px 0 var(--c1);background:linear-gradient(90deg,var(--c3),var(--c4),var(--c5));margin-bottom:30px}
.head{display:flex;align-items:center;gap:16px}
.pfp{flex:none;width:112px;height:112px;border-radius:50%;border:4px solid var(--c4);box-shadow:6px 6px 0 var(--c1);background:var(--c5) center/cover no-repeat;display:grid;place-items:center;font-family:"Unbounded",sans-serif;font-weight:900;font-size:30px;color:var(--c3);overflow:hidden}
.pfp img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:0;font-family:"Unbounded",sans-serif;font-weight:900;font-size:clamp(24px,7vw,31px);line-height:1.05;color:var(--c3);text-shadow:3px 3px 0 var(--c1)}
.user{margin:10px 0 0;font-family:"Unbounded",sans-serif;font-weight:700;font-size:15px;color:var(--c1);letter-spacing:.2px;text-shadow:none}
.bio{margin:26px 0 0;font-size:17px;line-height:1.5;text-shadow:2px 2px 0 rgba(140,0,0,.25)}
.bio span{white-space:nowrap}
.bio i{font-style:normal;color:var(--c3);margin:0 4px}
.panel{margin-top:28px;padding:22px 16px 16px;background:var(--card);border:3px solid var(--c4);border-radius:26px;box-shadow:7px 7px 0 var(--c1)}
.panel h2{margin:0 0 18px;text-align:center;font-family:"Unbounded",sans-serif;font-size:15px;line-height:1.3;font-weight:700;color:var(--c1);text-shadow:none}
.links{display:grid;gap:14px}
.link{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--btn);color:var(--ink);text-decoration:none;font-size:18px;border:3px solid var(--c4);border-radius:14px;box-shadow:5px 5px 0 var(--c1);text-shadow:1px 1px 0 rgba(140,0,0,.2);transition:transform .12s,box-shadow .12s,background .12s}
.link svg{flex:none;width:26px;height:26px}
.link:hover{background:var(--c5);color:var(--ink);transform:translate(3px,3px);box-shadow:2px 2px 0 var(--c1)}
.link:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--c1)}
.link:focus-visible,.ic:focus-visible{outline:4px solid var(--c2);outline-offset:3px}
.icons{display:flex;justify-content:center;gap:16px;margin-top:30px}
.ic{width:58px;height:58px;display:grid;place-items:center;color:var(--c3);background:var(--c5);border:3px solid var(--c4);border-radius:16px;box-shadow:4px 4px 0 var(--c1);transition:transform .12s,box-shadow .12s}
.ic svg{width:28px;height:28px}
.ic:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--c1)}
.ic:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--c1)}
.row{display:flex;gap:10px;align-items:stretch}
.row .link{flex:1;min-width:0}
.copy{flex:none;width:58px;display:grid;place-items:center;cursor:pointer;font:inherit;color:var(--c3);background:var(--c5);border:3px solid var(--c4);border-radius:14px;box-shadow:5px 5px 0 var(--c1);transition:transform .12s,box-shadow .12s}
.copy svg{width:24px;height:24px}
.copy:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--c1)}
.copy:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--c1)}
.copy:focus-visible{outline:4px solid var(--c2);outline-offset:3px}
.copy.done{background:var(--c3);color:var(--btn)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--c1);color:var(--btn);border:3px solid var(--c4);border-radius:14px;padding:10px 18px;font-size:16px;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{margin-top:34px;text-align:center;font-size:15px;border-top:3px solid var(--c4);padding-top:14px;text-shadow:1px 1px 0 rgba(140,0,0,.2)}
footer sup{font-size:.7em}
</style>
</head>
<body>
<main class="wrap">

  <section class="head">
    <!-- PROFILE PIC: put the picture URL in PROFILE_PIC in the script below -->
    <div class="pfp" id="pfp" aria-label="Profile picture of Nildo Motion">NN</div>
    <div>
      <h1>Nildo Motion</h1>
      <p class="user">@nildomotionart</p>
    </div>
  </section>

  <p class="bio"><span>Digital Creator</span><i>|</i> <span>Visual Artist</span><i>|</i> <span>Animator</span><i>|</i> <span>Web Developer</span></p>

  <section class="panel">
    <h2>Social media / Platform links</h2>
    <div class="links" id="links"></div>
  </section>

  <nav class="icons" id="icons" aria-label="App icons"></nav>

  <footer>© 2026 Odnil Amarille. All rights reserved. <sup>&reg;</sup></footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ====== ADD YOUR LINKS AND PICTURE HERE ====== */
var PROFILE_PIC = "nildo2.png";            // e.g. "https://.../picture.jpg"
var LINKS = {
  facebook:  "https://www.facebook.com/profile.php?id=61592896529212",                 // Facebook Page link
  instagram: "https://instagram.com/nildomotionart?cplk=eGR5bmdvcXp4ODRl",                 // Instagram link
  tiktok:    "tiktok.com/@nildomotion",                 // TikTok link
  youtube:   "https://www.youtube.com/@NildoMotion"                  // YouTube Channel link
};
/* ===================================================== */

var ICONS = {
  facebook:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 22v-8.2h2.8l.5-3.3h-3.3V8.4c0-.9.4-1.7 1.8-1.7h1.6V3.8S15.6 3.5 14.4 3.5c-2.6 0-4.2 1.600-4.200 4.400v2.600H7.400v3.300h2.800V22z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200"><rect x="3" y="3" width="18" height="18" rx="5.500"/><circle cx="12" cy="12" r="4.200"/><circle cx="17.300" cy="6.700" r="1" fill="currentColor" stroke="none"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.600 3c.3 2.300 1.600 3.700 3.900 3.900v3.100c-1.400.1-2.700-.3-3.900-1.100v5.600c0 3.600-2.600 5.800-5.600 5.800-3.200 0-5.600-2.400-5.600-5.400 0-3.300 2.800-5.700 6.300-5.200v3.200c-1.700-.5-3.100.6-3.100 2 0 1.200.9 2.100 2.200 2.100 1.300 0 2.200-.9 2.200-2.400V3z"/></svg>',
  youtube:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.600 7.200c-.2-.9-.9-1.600-1.800-1.800C18.200 5 12 5 12 5s-6.200 0-7.800.4c-.9.2-1.600.9-1.800 1.800C2 8.800 2 12 2 12s0 3.200.4 4.800c.2.900.9 1.600 1.800 1.800C5.800 19 12 19 12 19s6.200 0 7.800-.4c.9-.2 1.600-.9 1.800-1.800.4-1.600.4-4.800.4-4.800s0-3.200-.4-4.800zM10 15V9l5.200 3z"/></svg>'
};
var NAMES = {facebook:"Facebook Page",instagram:"Instagram",tiktok:"TikTok",youtube:"YouTube Channel"};
var COLORS = {facebook:"#F8650C",instagram:"#F00000",tiktok:"#F8650C",youtube:"#F00000"};

function href(k){
  var u = (LINKS[k] || "").trim();
  if (!u) return "#";
  return /^https?:\/\//i.test(u) ? u : "https://" + u;
}
var COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.500"/><path d="M5 15H4.500A1.500 1.500 0 0 1 3 13.500v-9A1.500 1.500 0 0 1 4.500 3h9A1.500 1.500 0 0 1 15 4.500V5"/></svg>';
var toastEl = document.getElementById("toast"), toastT;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
}
function copyText(text){
  if (navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function(res, rej){
    var t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy") ? res() : rej(); } catch(e){ rej(e); }
    document.body.removeChild(t);
  });
}
var L = document.getElementById("links"), I = document.getElementById("icons");
Object.keys(NAMES).forEach(function(k){
  var a = document.createElement("a");
  a.className = "link"; a.href = href(k); a.target = "_blank"; a.rel = "noopener";
  a.innerHTML = '<span style="color:'+COLORS[k]+';display:flex">'+ICONS[k]+'</span><span>'+NAMES[k]+'</span>';
  var row = document.createElement("div"); row.className = "row";
  var c = document.createElement("button");
  c.type = "button"; c.className = "copy"; c.innerHTML = COPY_ICON;
  c.setAttribute("aria-label", "Copy link for " + NAMES[k]); c.title = "Copy link";
  c.addEventListener("click", function(){
    copyText(href(k)).then(function(){
      c.classList.add("done"); toast(NAMES[k] + " link copied!");
      setTimeout(function(){ c.classList.remove("done"); }, 1500);
    }, function(){ toast("Couldn't copy. Please try again."); });
  });
  row.appendChild(a); row.appendChild(c); L.appendChild(row);
  var b = document.createElement("a");
  b.className = "ic"; b.href = href(k); b.target = "_blank"; b.rel = "noopener";
  b.setAttribute("aria-label", NAMES[k]); b.innerHTML = ICONS[k];
  I.appendChild(b);
});
if (PROFILE_PIC){
  var img = document.createElement("img");
  img.src = PROFILE_PIC; img.alt = "Nildo Motion";
  var p = document.getElementById("pfp"); p.textContent = ""; p.appendChild(img);
}
</script>
</body>
</html>
